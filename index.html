    background:var(--panel);
    border-top:1px solid var(--line);
    font-size:0.75rem;
    color:var(--muted);
  }

  iconAnchor: [14, 38],
  popupAnchor: [0, -34]
});

teams.forEach(t => {
  // small deterministic jitter so co-located teams don't perfectly overlap
  const jitter = () => (((t.n * 9301 + 49297) % 233280) / 233280 - 0.5) * 0.01;
  const lat = t.lat + jitter();
  const lon = t.lon + jitter();

  const marker = L.marker([lat, lon], { icon: pinIcon });

  const tbaUrl = "https://www.thebluealliance.com/team/" + t.n;

  const locLine = t.address ? t.address : t.city + " (city-level, exact site unconfirmed)";

  marker.bindPopup(
    '<div class="popup-team">' +
      '<span class="num">#' + t.n + '</span>' +
      '<div class="name">' + t.name + '</div>' +
      '<div class="city">' + locLine + '</div>' +
      '<a href="' + tbaUrl + '" target="_blank" rel="noopener">View on The Blue Alliance</a>' +
    '</div>'
  );

  cluster.addLayer(marker);
});
